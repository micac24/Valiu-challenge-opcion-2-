          const box = opx.querySelector(`[data-field="${role}"]`); if (!box) return;
          const fixed = role === 'buy' ? c.fixedBuy : !c.fixedBuy;
          box.classList.toggle('fixed', fixed);
          box.querySelector('[data-tag]').textContent = fixed ? 'Monto fijo' : '≈ estimado';
          const inp = box.querySelector('input'), val = role === 'buy' ? c.buyAmt : c.payAmt;
          if (!fixed || ox.mode === 'pagos') inp.value = val ? fmt(val) : '';
        });
      }
      const ln = opx.querySelector('#ox-line'); if (ln) ln.innerHTML = lineHtml(c);
      const nt = opx.querySelector('#ox-notes'); if (nt) nt.innerHTML = notesHtml(c);
      if (ox.qerr) { ox.qerr = false; const qe = opx.querySelector('#ox-qerr'); if (qe) qe.remove(); }
      const qb = opx.querySelector('#ox-quote'); if (qb && !ox.busy) { qb.disabled = false; qb.textContent = ox.kind === 'pay' && c.same ? 'Continuar' : 'Cotizar'; }
      opx.querySelector('#ox-side').innerHTML = sidePanel();
    }

    /* Paso 2 */
    function clockHtml(q, x) {
      return `<div class="ox-clock">
        <div class="ox-ctop"><span class="ox-c-l"><span class="muted ox-c-k">Tipo de cambio firme</span><b class="num ox-rate">${rateTxt(q.rate, x)}</b><span class="muted ox-c-u">${x.p.quote} por 1 ${x.p.base}</span></span><span class="ox-count num" data-count aria-label="Tiempo restante">${clockTxt(q.exp - Date.now())}</span></div>
        <div class="ox-bar"><span data-bar></span></div>
        <div class="muted">Vale 2 minutos. Vence a las ${hhmmss(q.exp)}. <span class="ox-hurry"><i class="ti ti-alert-triangle" aria-hidden="true"></i>Quedan pocos segundos.</span> <button class="link demo" data-ox-skip data-fk="skip">Demo: adelantar a 0:05</button></div>
      </div>`;
    }
    const kvHtml = rows => `<dl class="kv ox-kv">${rows.map(([k, v]) => `<div class="kv-row"><dt>${k}</dt><dd class="num">${v}</dd></div>`).join('')}</dl>`;

    function stepConfirm() {
      const shown = ox.modal ? ox.prev : ox.quote, c = calc(shown ? shown.rate : undefined);
      const pa = acct(ox.pay), ba = acct(ox.buy), pay = ox.kind === 'pay', d = payDest();
      const rows = pay
        ? [[d.own ? 'Cuenta que recibe' : 'Destinatario', escHtml(d.name)], ['Monto del pago', `${ox.buy} ${fmt(c.buyAmt)}`], ['Pagas con', `${pa.alias} · ${ox.pay} ${fmt(c.payAmt)}`]]
        : [['Compras', `${ox.buy} ${fmt(c.buyAmt)}`], ['Pagas con', `${pa.alias} · ${ox.pay} ${fmt(c.payAmt)}`]];
      if (!pay && ox.mode === 'pagos') rows.push(['Pagos que cubre', selPays().map(p => `${escHtml(p.to)} (${dateOf(p.day)})`).join('<br>')]);
      if (ox.motivo) rows.push(['Motivo de pago', escHtml(ox.motivo)]);
      if (reasonOf()) rows.push(['Detalle / Referencia', escHtml(reasonOf())]);
      if (c.x) rows.push(['Par y punta', `${c.x.name} · ${sideWord(c.x)}`], ['Diferencia contra el indicativo', diffTxt(c, shown.ind).txt]);
      rows.push([`Saldo después en ${pa.alias}`, `${ox.pay} ${fmt(pa.balance - c.payAmt)}`]);
      if (!pay || d.own) rows.push([`Saldo después en ${ba.alias}`, `${ox.buy} ${fmt(ba.balance + c.buyAmt)}`]);
      const clock = !shown ? ''
        : ox.modal ? `<div class="ox-clock expired"><div class="ox-ctop"><span><span class="muted">Tipo de cambio firme</span> <s class="num ox-rate">${rateTxt(shown.rate, c.x)}</s></span><span class="ox-count num">0:00</span></div><div class="muted">Venció a las ${hhmmss(shown.exp)}. No se envió nada.</div></div>`
        : clockHtml(shown, c.x);
      return `<div class="card ox-card">
        <div class="ox-card-head"><h2 class="ox-h" tabindex="-1">Confirmar</h2>${shown ? `<span class="muted">Cotización ${shown.id}</span>` : ''}</div>
        ${clock}
        ${kvHtml(rows)}
        <div class="ox-actions"><button type="button" class="link ox-back" data-ox-step="${ox.kind === 'pay' ? 2 : 1}" data-fk="edit" aria-label="Volver al paso anterior y editar"><i class="ti ti-arrow-left" aria-hidden="true"></i>Volver</button><span class="ox-acts-r"><button type="button" class="btn ox-cancel-btn" data-ox-close data-fk="cancel">Cancelar</button><button class="btn ${ox.modal ? '' : 'btn-primary'}" id="ox-tonext" data-ox-tonext data-fk="tonext" ${ox.modal ? 'disabled' : ''}>Ingresar token</button></span></div>
      </div>`;
    }


    function stepToken() {
      const shown = ox.modal ? ox.prev : ox.quote, c = calc(shown ? shown.rate : undefined);
      const pa = acct(ox.pay), pay = ox.kind === 'pay', d = payDest();
      if (!ox.tokExp) ox.tokExp = Date.now() + TOK_MS;
      const tokLeft = Math.max(0, ox.tokExp - Date.now());
      setTimeout(runTokClock, 0);
      const clock = !shown ? ''
        : ox.modal ? `<div class="ox-clock expired"><div class="ox-ctop"><span class="ox-c-l"><span class="muted ox-c-k">Tipo de cambio firme</span><s class="num ox-rate">${rateTxt(shown.rate, c.x)}</s><span class="muted ox-c-u">${c.x.p.quote} por 1 ${c.x.p.base}</span></span><span class="ox-c-r"><span class="muted ox-c-k">Venció</span><span class="ox-count num">0:00</span></span></div><div class="muted">Venció a las ${hhmmss(shown.exp)}. No se envió nada.</div></div>`
        : clockHtml(shown, c.x);
      const line = pay ? `Vas a pagar <b class="num">${ox.buy} ${fmt(c.buyAmt)}</b> a ${escHtml(d.name)}` : `Vas a comprar <b class="num">${ox.buy} ${fmt(c.buyAmt)}</b> pagando <b class="num">${ox.pay} ${fmt(c.payAmt)}</b> desde ${escHtml(pa.alias)}`;
      return `<div class="card ox-card">
        <div class="ox-card-head"><h2 class="ox-h" tabindex="-1">Confirma con tu token</h2>${shown ? `<span class="muted">Cotización ${shown.id}</span>` : ''}</div>
        ${clock}
        <section class="ox-tokbox" role="group" aria-labelledby="ox-token-l" aria-describedby="ox-token-h">
          <span id="ox-token-l" class="sr-only">Token de 6 dígitos de tu app</span>
          <div class="ox-otp">${[0, 1, 2, 3, 4, 5].map(k => `<input class="ox-otp-d num" data-ox-tokd="${k}" data-fk="token-${k}" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="${k === 0 ? 'one-time-code' : 'off'}" value="${escHtml((ox.token || '')[k] || '')}" aria-label="Dígito ${k + 1} de 6" ${ox.modal ? 'disabled' : ''}>`).join('')}</div>
          <div class="ox-tokclock${tokLeft <= 5000 ? ' alert' : ''}" data-tokclock>
            <span class="ox-tokcount num" data-tokcount aria-hidden="true">${tokTxt(tokLeft)}</span>
            <span class="ox-tokline">Tu token se vencerá en <b data-tokleft>${Math.ceil(tokLeft / 1000)} segundos</b>.</span>
            <span id="ox-token-h" class="muted">Si vence, se genera uno nuevo. Escribe el código de tu app de token.</span>
          </div>
          <p class="ox-tokmsg" role="status" data-tokmsg>${ox.tokExpired ? 'El token venció y se generó uno nuevo. Escribe el código actualizado.' : ''}</p>
        </section>
        <p class="ox-sendline">${line}.</p>
        <div class="ox-actions"><button type="button" class="link ox-back" data-ox-tostep="2" data-fk="back" aria-label="Volver a los detalles de la operación"><i class="ti ti-arrow-left" aria-hidden="true"></i>Volver</button><span class="ox-acts-r"><button type="button" class="btn ox-cancel-btn" data-ox-close data-fk="cancel">Cancelar</button><button class="btn ${ox.modal ? '' : 'btn-primary'}" id="ox-confirm" data-ox-confirm data-fk="confirm" ${ox.modal ? 'disabled' : ''}>${actionTxt(c)}</button></span></div>
      </div>`;
    }

    function modalHtml() {
      const c = calc(), x = c.x, same = ox.prev.rate === ox.quote.rate, d = diffTxt(c, ox.prev.rate);
      const cta = c.short ? '' : `<button class="btn btn-primary" id="ox-accept" data-ox-accept>${same ? 'Seguir con este precio' : 'Aceptar precio nuevo'}</button>`;
      return `<div class="ox-ov"><div class="ox-modal" role="alertdialog" aria-modal="true" aria-labelledby="ox-m-title" aria-describedby="ox-m-desc">
        <h2 id="ox-m-title">${same ? 'Actualizamos la cotización' : 'La cotización cambió'}</h2>
        <p class="muted" id="ox-m-desc">El precio anterior venció a las ${hhmmss(ox.prev.exp)} y no se envió nada. ${same ? 'El precio sigue igual.' : 'Para seguir, acepta el precio nuevo.'}</p>
        <div class="ox-cmp"><div><span class="muted">Antes</span><s class="num">${rateTxt(ox.prev.rate, x)}</s></div><i class="ti ti-arrow-right" aria-hidden="true"></i><div><span class="muted">Ahora</span><b class="num">${rateTxt(ox.quote.rate, x)}</b></div></div>
        ${same ? '' : `<div class="ox-delta ${d.worse ? 'worse' : ''}">${d.txt}</div>`}
        ${c.short ? `<div class="ox-note err"><i class="ti ti-alert-triangle" aria-hidden="true"></i><span>Con el precio nuevo te faltan ${ox.pay} ${fmt(c.short)} en ${acct(ox.pay).alias}. Cancela la operación y elige otra cuenta.</span></div>` : ''}
        ${clockHtml(ox.quote, x)}
        <div class="ox-actions"><button class="btn" data-ox-cancel>Cancelar operación</button>${cta}</div>
      </div></div>`;
    }

    function runClock() {
      stopClock();
      const tick = () => {
        if (!ox.quote) return stopClock();
        const left = ox.quote.exp - Date.now();
        opx.querySelectorAll('[data-count]').forEach(el => { el.textContent = clockTxt(left); });
        opx.querySelectorAll('[data-bar]').forEach(el => { el.style.width = Math.max(0, left / (OP_SECS * 1000) * 100) + '%'; });
        opx.querySelectorAll('.ox-clock:not(.expired)').forEach(el => el.classList.toggle('alert', left <= 15000));
        const btn = opx.querySelector(ox.modal ? '#ox-accept' : (ox.step === 3 ? '#ox-confirm' : '#ox-tonext'));
        if (btn) btn.disabled = left <= 2000;
        if (left <= 0) { ox.prev = ox.quote; ox.quote = newQuote(ox.prev); ox.modal = 'changed'; renderOp(); }
      };
      tick(); opTimer = setInterval(tick, 250);
    }
    function stopClock() { clearInterval(opTimer); opTimer = null; }

    /* Paso 3: la operación se envía al banco y cambia de estado sola */
    function refreshHome() { renderSummary(); renderTable('cuentas'); renderTable('pagos'); renderTable('ingresos'); renderInsights(); if (!ox.open) refreshAcctPage(); }
    function refreshAcctPage() {
      const pg = document.getElementById('acct-page'); if (!pg || pg.hidden) return;
      const tab = pg.querySelector('[data-rcv-tab]'); if (!tab) return;
      const y = window.scrollY; openAccount(tab.dataset.cur, true); window.scrollTo(0, y);
    }

    function sendOp() {
      if (ox.quote && Date.now() > ox.quote.exp - 2000) return;
      const c = calc(), bm = blockMsg(c);
      if (bm) { backToBuild(bm); return; }
      if (!canQuote(c)) return;
      stopClock();
      const isPay = ox.kind === 'pay', d = payDest(), pa = acct(ox.pay), x = c.x;
      const own = isPay && d.own, cyc = !isPay || own ? 'fx' : x ? 'pc' : 'ps';
      const rec = { id: Math.max(0, ...OPS.map(o => o.id)) + 1, day: TODAY, time: simTime(), status: 'En proceso',
        from: pa.alias, fromL: pa.last4, to: isPay ? d.name : acct(ox.buy).alias, toL: isPay ? d.last4 : acct(ox.buy).last4,
        by: 'Usuario Demo', detail: reasonOf() || 'Sin motivo', folio: 'VAL-' + (24820 + recSeq),
        flow: ox.kind, cyc, buyCur: ox.buy, buyAmt: c.buyAmt, payCur: ox.pay, payAmt: c.payAmt, x, fRate: ox.quote ? ox.quote.rate : null,
        sched: !!schedMsg(c), payment: ox.payment, pays: !isPay && ox.mode === 'pagos' ? selPays() : [], reason: reasonOf(), motivo: ox.motivo };
      if (x) {
        rec.kind = x.op; rec.pair = x.name; rec.rate = rec.fRate;
        if (x.op === 'Compra') Object.assign(rec, { amt: c.buyAmt, cur: ox.buy, other: c.payAmt, otherCur: ox.pay });
        else Object.assign(rec, { amt: c.payAmt, cur: ox.pay, other: c.buyAmt, otherCur: ox.buy });
      } else Object.assign(rec, { kind: 'Transferencia', amt: c.buyAmt, cur: ox.buy });
      recSeq++;
      pa.balance = round2(pa.balance - c.payAmt);
      PAST.unshift({ cur: ox.pay, day: TODAY, desc: `${isPay && !own ? 'Pago a ' + d.name : 'Compra ' + ox.buy + ' con ' + ox.pay} · ${rec.folio}`, kind: cyc === 'fx' ? 'Cambio' : 'Pago', amt: -c.payAmt });
      if (rec.payment) PAYMENTS.splice(PAYMENTS.indexOf(rec.payment), 1);
      OPS.unshift(rec);
      if (ox.from) state.doneInsights.set(ox.from, 'hecha');
      ox.result = rec; ox.modal = null; ox.quote = null; ox.step = 4;
      renderOp(); refreshHome();
      const steps = cyc === 'pc' ? ['Pactada', 'Enviada'] : ['Confirmada', 'Enviada'];
      steps.forEach((s, i) => setTimeout(() => advance(rec, s), BANK_MS * (i + 1)));
    }

    function notify(icon, tone, text) {
      const colors = { ok: ['var(--ok-bg)', 'var(--ok-text)'], info: ['var(--primary-soft)', 'var(--primary)'], off: ['var(--head-bg)', 'var(--muted)'] }[tone];
      NOTIFS.unshift({ id: Math.max(0, ...NOTIFS.map(n => n.id)) + 1, icon, bg: colors[0], fg: colors[1], text, when: 'Ahora', go: { scroll: 'ingresos' } });
      renderNotifs();
    }
    function advance(rec, status) {
      if (rec.sched && rec.status === 'En proceso' && (payWin().restricted || payWin().limited)) { setTimeout(() => advance(rec, status), BANK_MS); return; }
      if (rec.status !== 'En proceso' && !(rec.status === 'Pactada' && status === 'Enviada') && !(rec.status === 'Confirmada' && status === 'Enviada')) return;
      rec.status = status;
      if (rec.cyc === 'fx' && status === 'Enviada') {
        const ba = acct(rec.buyCur);
        ba.balance = round2(ba.balance + rec.buyAmt);
        PAST.unshift({ cur: rec.buyCur, day: TODAY, desc: `Compra ${rec.buyCur} con ${rec.payCur} · ${rec.folio}`, kind: 'Cambio', amt: rec.buyAmt });
      }
      const amt = `${rec.buyCur} ${fmt(rec.buyAmt)}`;
      if (status === 'Confirmada') notify('ti-check', 'ok', rec.cyc === 'fx' ? `El banco confirmó tu compra de ${amt} (${rec.folio})` : `El banco confirmó el pago a ${rec.to} por ${amt} (${rec.folio})`);
      if (status === 'Pactada') notify('ti-arrows-exchange', 'info', `Se cambiaron ${rec.payCur} ${fmt(rec.payAmt)} a ${rec.buyCur} para el pago a ${rec.to} (${rec.folio})`);
      if (status === 'Enviada') notify('ti-send', 'ok', rec.cyc === 'fx' ? `Se acreditaron ${amt} en ${acct(rec.buyCur).alias} (${rec.folio})` : `Se envió el pago a ${rec.to} por ${amt} (${rec.folio})`);
      refreshHome();
      if (ox.open && ox.step === 4 && ox.result === rec) renderOp();
    }
    function cancelRec(rec) {
      if (!rec) return;
      if (rec.status !== 'En proceso') { toast('Ya no se puede cancelar: el banco empezó a procesarla.'); return; }
      rec.status = 'Cancelada';
      if (rec.payCur) {
        const pa = acct(rec.payCur);
        pa.balance = round2(pa.balance + rec.payAmt);
        PAST.unshift({ cur: rec.payCur, day: TODAY, desc: `Cancelación ${rec.folio}`, kind: rec.cyc === 'fx' ? 'Cambio' : 'Pago', amt: rec.payAmt });
        if (rec.payment && !PAYMENTS.includes(rec.payment)) PAYMENTS.push(rec.payment);
        toast(`Cancelaste ${rec.folio}. Volvieron ${rec.payCur} ${fmt(rec.payAmt)} a ${pa.alias}.`);
      } else toast(`Cancelaste ${rec.folio}.`);
      refreshHome();
      if (ox.open && ox.step === 4 && ox.result === rec) renderOp();
    }

    function resultCopy(r) {
      const amt = `${r.buyCur} ${fmt(r.buyAmt)}`;
      switch (r.status) {
        case 'En proceso': if (r.sched) return ['Tu pago quedó programado', 'El banco lo envía a las 06:30. Te avisaremos cuando cambie el estado.'];
          return ['Tu operación fue enviada al banco', `El banco va a confirmar ${r.flow === 'pay' ? 'el pago' : 'la compra'}. Te avisaremos cuando cambie el estado.`];
        case 'Confirmada': return r.cyc === 'fx'
          ? [`El banco confirmó tu compra de ${amt}`, `Se acreditan en ${acct(r.buyCur).alias} cuando el banco la envíe. Ya no se puede cancelar.`]
          : ['El banco confirmó el pago', `Lo va a enviar a ${r.to}. Ya no se puede cancelar.`];
        case 'Pactada': return ['Se cambió la divisa del pago', `El banco cambió ${r.payCur} a ${r.buyCur} y está por enviar el pago a ${r.to}. Ya no se puede cancelar.`];
        case 'Enviada': return r.cyc === 'fx' ? [`Se acreditaron ${amt}`, `Los ${r.buyCur} ya están en ${acct(r.buyCur).alias}.`] : [`Se envió el pago a ${r.to}`, `${amt} salieron hacia ${r.to}.`];
        case 'Cancelada': return ['Cancelaste la operación', `Volvieron ${r.payCur} ${fmt(r.payAmt)} a ${acct(r.payCur).alias}.`];
        default: return [`Operación ${r.status.toLowerCase()}`, ''];
      }
    }
    function stepResult() {
      const r = ox.result, pa = acct(r.payCur), [title, sub] = resultCopy(r), isPay = r.flow === 'pay';
      const rows = [['Estado', stChip(r.status)], ['Folio', r.folio], ['Fecha y hora', `${dateOf(r.day)} · ${r.time}`], ['Tipo', kindTxt(r)]];
      if (isPay) rows.push([r.cyc === 'fx' ? 'Cuenta que recibe' : 'Destinatario', escHtml(r.to)], ['Monto del pago', `${r.buyCur} ${fmt(r.buyAmt)}`]);
      else rows.push(['Compras', `${r.buyCur} ${fmt(r.buyAmt)}`]);
      rows.push(['Pagas con', `${pa.alias} · ${r.payCur} ${fmt(r.payAmt)}`]);
      if (r.x) rows.push(['Par y punta', `${r.x.name} · ${sideWord(r.x)}`], ['Precio', fmt(r.fRate, r.x.p.dp)]);
      if (r.pays.length) rows.push(['Pagos que cubre', r.pays.map(p => `${escHtml(p.to)} (${dateOf(p.day)})`).join('<br>')]);
      if (r.motivo) rows.push(['Motivo de pago', escHtml(r.motivo)]);
      if (r.reason) rows.push(['Detalle / Referencia', escHtml(r.reason)]);
      // Si se entró a pagar desde una cuenta y quedan pagos en esa divisa, se ofrece el siguiente (pedido de la usuaria)
      const pend = isPay && ox.xfer ? PAYMENTS.filter(q => q.cur === ox.xfer).sort((a, b) => a.day - b.day || a.id - b.id) : [];
      const next = pend[0] || null;
      const nextHtml = next ? `<div class="ox-next" role="status"><span class="ox-next-ic" aria-hidden="true"><i class="ti ti-list-details"></i></span><div><b>${pend.length === 1 ? `Te queda 1 pago en ${ox.xfer}` : `Te quedan ${pend.length} pagos en ${ox.xfer}`}. ¿Quieres pagar el siguiente?</b><span class="muted">${escHtml(next.to)} · ${next.cur} ${fmt(next.amt)} · vence el ${dateOf(next.day)}${next.concept ? ' · ' + escHtml(next.concept) : ''}</span></div></div>` : '';
      return `<div class="card ox-card">
        <div class="ox-rhead">
          <span class="ox-rico ${ST[r.status].tone}"><i class="ti ${ST[r.status].icon}" aria-hidden="true"></i></span>
          <h2 class="ox-h" tabindex="-1">${title}</h2><p>${sub}</p>
        </div>
        ${kvHtml(rows)}
        <div class="ox-links"><button class="link" data-ox-dl data-fk="dl"><i class="ti ti-download" aria-hidden="true"></i>Descargar comprobante</button><button class="link" data-ox-share data-fk="share"><i class="ti ti-share-2" aria-hidden="true"></i>Compartir</button></div>
        ${nextHtml}
        <div class="ox-cta">${next ? `<button class="btn btn-primary" data-ox-next="${next.id}" data-fk="next">Pagar a ${escHtml(next.to)}</button><button class="btn" data-ox-again data-fk="again">Hacer otra operación</button><button class="link ox-tert" data-ox-close data-fk="home">Volver al inicio</button>` : '<button class="btn btn-primary" data-ox-again data-fk="again">Hacer otra operación</button><button class="btn" data-ox-close data-fk="home">Volver al inicio</button>'}
</div>
      </div>`;
    }

    // Primero las cuentas de la operación (con la que pagas, luego la que recibes) y después las demás, en su orden
    const sideAccts = () => { const rank = a => a.cur === ox.pay ? 0 : a.cur === ox.buy ? 1 : 2; return ACCOUNTS.map((a, i) => [a, i]).sort((x, y) => rank(x[0]) - rank(y[0]) || x[1] - y[1]).map(x => x[0]); };
    function sidePanel() {
      const live = ox.step < 4 && (ox.step >= 2 || !ox.modal);
      const shown = ox.step === 2 || ox.step === 3 ? (ox.modal ? ox.prev : ox.quote) : null;
      const c = ox.step === 1 ? calc() : ox.step === 2 || ox.step === 3 ? calc(shown ? shown.rate : undefined) : null;
      const d = payDest();
      const after = a => {
        if (!live || !c || !(c.x || c.same) || !(c.buyAmt > 0)) return '';
        const credit = ox.kind === 'fx' || (d && d.own);
        const v = a.cur === ox.pay ? a.balance - c.payAmt : a.cur === ox.buy && credit ? a.balance + c.buyAmt : null;
        return v == null ? '' : `<div class="ox-kv"><span>Después</span><span class="num">${ox.step === 1 && c.x ? '≈ ' : ''}${a.cur} ${fmt(v)}</span></div>`;
      };
      return `<div class="card ox-side-card"><h2>Tus cuentas</h2>${sideAccts().map(a => `
        <div class="ox-acct ${a.cur === ox.buy || a.cur === ox.pay ? 'on' : ''}">
          <span class="fi fi-${a.flag} fis mini-flag" aria-hidden="true"></span>
          <div class="cell"><div class="cell-main">${a.alias}</div><div class="muted">${a.cur} ··${a.last4}</div></div>
          <div class="ox-kvs"><div class="ox-kv"><span>Saldo</span><span class="amt num">${a.cur} ${fmt(a.balance)}</span></div>${after(a)}</div>
        </div>`).join('')}</div>`;
    }

    /* Eventos de Operar */
    opx.addEventListener('click', e => {
      const hit = s => e.target.closest(s);
      if (hit('[data-ox-close]')) { closeOp(); return; }
      const blk = hit('[data-ox-blocked]');
      if (blk) { e.preventDefault(); const bq = PAYMENTS.find(x => x.id === Number(blk.dataset.oxBlocked)); toast(`Necesitas comprar más ${bq ? bq.cur : ''} para poder pagar este pago.`); return; }
      if (hit('[data-ox-pick]')) {
        const b = hit('[data-ox-pick]'); ox.pend = { t: 'd', v: b.dataset.oxPick };
        opx.querySelectorAll('[data-ox-pick]').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
        const n = opx.querySelector('#ox-dnext'); if (n) n.disabled = false; return;
      }
      if (hit('[data-ox-dnext]')) {
        const pd = ox.pend; if (!pd) { markField('dest', 'Elige un destinatario o un pago de la lista.'); return; } ox.pend = null;
        if (pd.t === 'd') { pickDest(pd.v); return; }
        const q = PAYMENTS.find(p => p.id === pd.id);
        Object.assign(ox, { payment: q, buy: q.cur, amt: q.amt, pay: ox.xfer || paySource(q), reason: '', reasonTouched: false });
        renderOp(); return;
      }
      if (hit('[data-ox-repick]')) { repick(); return; }
      if (hit('[data-ox-mode]')) {
        const m = hit('[data-ox-mode]').dataset.oxMode;
        if (m !== ox.mode) {
          if (m === 'pagos') { if (!ox.sel.size) ox.buy = ''; } else if (ox.buy) ox.amt = calc().buyAmt;
          ox.mode = m; ox.fixed = 'buy'; ox.total = false; renderOp();
        }
        return;
      }
      if (hit('[data-ox-pmode]')) {
        const m = hit('[data-ox-pmode]').dataset.oxPmode;
        if (hit('[data-ox-pmode]').getAttribute('aria-disabled') === 'true') { toast(`Ningún pago de ${ox.xfer} alcanza con tu saldo. Compra más ${ox.xfer} o paga por destinatario.`); return; }
        if (m !== ox.pmode) { Object.assign(ox, { pmode: m, pend: null, payment: null, dest: '', buy: '', amt: 0, pay: ox.pay0, reason: '', reasonTouched: false }); renderOp(); }
        return;
      }
      if (hit('[data-ox-total]')) { ox.total = !ox.total; renderOp(); return; }
      if (hit('[data-ox-quote]')) {
        const c = calc(), why = whyNot(c);
        if (why) { if (why.field) markField(why.field, why.msg); else showWhy(why.msg); return; }
        startQuote(); return;
      }
      if (hit('[data-ox-qretry]')) { ox.qerr = false; if (UI.mode === 'error') { UI.mode = 'normal'; syncDemo(); renderAll(true); } startQuote(); return; }
      if (hit('[data-ox-step]')) {
        const n = Number(hit('[data-ox-step]').dataset.oxStep), msg = (ox.step === 2 || ox.step === 3) && ox.quote ? 'Descartamos la cotización. No se envió nada.' : '';
        if (n === (ox.kind === 'pay' ? 3 : 2) && ox.step === 3) { ox.step = 2; ox.token = ''; ox.tokExp = 0; ox.tokExpired = false; renderOp(); return; }
        if (ox.kind === 'pay' && n === 1) { if (ox.step !== 1) backToBuild(msg); repick(); }
        else if (ox.kind !== 'pay' || n === 2) backToBuild(msg);
        return;
      }
      if (hit('[data-ox-skip]')) { ox.quote.exp = Date.now() + 5000; renderOp(); return; }
      if (hit('[data-ox-accept]')) { ox.modal = null; ox.prev = null; renderOp(); return; }
      if (hit('[data-ox-tonext]')) { if (ox.quote && Date.now() > ox.quote.exp - 2000) return; ox.step = 3; ox.token = ''; ox.tokExp = 0; ox.tokExpired = false; renderOp(); return; }
      if (hit('[data-ox-tostep]')) { ox.step = 2; ox.token = ''; ox.tokExp = 0; ox.tokExpired = false; renderOp(); return; }
      if (hit('[data-ox-confirm]')) { startSend(); return; }
      if (hit('[data-ox-cancel]')) { backToBuild('Operación cancelada. No se envió nada.'); return; }
      if (hit('[data-ox-next]')) { const cur = ox.xfer; openOp({ kind: 'pay', payId: Number(hit('[data-ox-next]').dataset.oxNext), pay: cur, title: 'Pagar' }); return; }
      if (hit('[data-ox-again]')) { openOp(ox.kind === 'pay' ? { kind: 'pay' } : {}); return; }
      if (hit('[data-ox-cancelrec]')) { cancelRec(OPS.find(r => r.id === Number(hit('[data-ox-cancelrec]').dataset.oxCancelrec))); return; }
      if (hit('[data-ox-dl]')) { toast(`En producción descargarías el comprobante ${ox.result.folio} en PDF.`); return; }
      if (hit('[data-ox-share]')) { toast(`En producción compartirías el link al comprobante ${ox.result.folio}.`); return; }
    });
    opx.addEventListener('keydown', e => {
      if (!e.target.matches('[data-ox-tokd]')) return;
      const ds = [...opx.querySelectorAll('[data-ox-tokd]')], k = Number(e.target.dataset.oxTokd);
      if (e.key === 'Backspace' && !e.target.value && k > 0) { ds[k - 1].value = ''; ds[k - 1].focus(); ox.token = ds.map(d => d.value).join(''); e.preventDefault(); }
      else if (e.key === 'ArrowLeft' && k > 0) { ds[k - 1].focus(); e.preventDefault(); }
      else if (e.key === 'ArrowRight' && k < 5) { ds[k + 1].focus(); e.preventDefault(); }
    });
    opx.addEventListener('paste', e => {
      if (!e.target.matches('[data-ox-tokd]')) return;
      const txt = ((e.clipboardData || window.clipboardData).getData('text') || '').replace(/\D/g, '').slice(0, 6);
      if (!txt) return;
      e.preventDefault();
      const ds = [...opx.querySelectorAll('[data-ox-tokd]')];
      ds.forEach((d, n) => { d.value = txt[n] || ''; });
      ox.token = txt; ds[Math.min(5, txt.length)].focus();
      const cb = opx.querySelector('#ox-confirm'); if (cb) cb.disabled = !!ox.modal || !!(ox.quote && Date.now() > ox.quote.exp - 2000);
    });
    opx.addEventListener('input', () => clearFieldErr(), true);
    opx.addEventListener('change', () => clearFieldErr(), true);
    opx.addEventListener('input', e => {
      if (e.target.matches('[data-ox-tokd]')) {
        const ds = [...opx.querySelectorAll('[data-ox-tokd]')], k = Number(e.target.dataset.oxTokd);
        const typed = e.target.value.replace(/\D/g, ''), cnt = Math.min(typed.length, 6 - k);
        if (cnt > 1) typed.slice(0, cnt).split('').forEach((ch, n) => { ds[k + n].value = ch; });
        e.target.value = typed.slice(0, 1);
        ox.token = ds.map(d => d.value).join(''); if (ox.tokExpired) { ox.tokExpired = false; const m = opx.querySelector('[data-tokmsg]'); if (m) m.textContent = ''; }
        if (cnt && k + cnt <= 5) ds[k + cnt].focus();
        const cb = opx.querySelector('#ox-confirm'); if (cb) cb.disabled = !!ox.modal || !!(ox.quote && Date.now() > ox.quote.exp - 2000);
        return;
      }
      if (e.target.matches('[data-ox-dsearch]')) {
        const q = e.target.value.trim().toLowerCase(); let n = 0;
        opx.querySelectorAll('[data-ox-pick]').forEach(b => { const ok = !q || b.dataset.q.includes(q); b.hidden = !ok; if (ok) n++; });
        opx.querySelectorAll('[data-ox-dsec]').forEach(sc => { sc.hidden = !sc.querySelector('[data-ox-pick]:not([hidden])'); });
        const em = opx.querySelector('[data-ox-dempty]'); em.hidden = n > 0;
        if (!n) em.innerHTML = `<b>No encontramos destinatarios con «${escHtml(e.target.value.trim())}»</b><span class="muted">Revisa el nombre, el banco o la divisa.</span>`;
        return;
      }
      if (e.target.matches('[data-ox-reason]')) { ox.reason = e.target.value; ox.reasonTouched = true; return; }
      const f = e.target.closest('[data-ox-amt]');
      if (!f || ox.mode === 'pagos' && ox.kind === 'fx') return;
      ox.fixed = f.dataset.oxAmt;
      ox.amt = parseFloat(f.value.replace(/[^0-9.]/g, '')) || 0;
      syncBuild();
    });
    // El lado fijo cambia al hacer click en el campo, no al escribir: el monto que muestra pasa a ser el fijo
    const fixOnClick = e => {
      const f = e.target.closest('[data-ox-amt]');
      if (!f || f.readOnly || ox.kind !== 'fx' || ox.mode === 'pagos' || ox.step !== 1) return;
      const role = f.dataset.oxAmt; if (ox.fixed === role) return;
      ox.fixed = role;
      ox.amt = parseFloat(f.value.replace(/[^0-9.]/g, '')) || 0;
      syncBuild();
    };
    opx.addEventListener('click', fixOnClick);
    opx.addEventListener('focusin', fixOnClick);
    opx.addEventListener('change', e => {
      if (e.target.matches('[data-ox-motivo]')) { ox.motivo = e.target.value; return; }
      const f = e.target.closest('[data-ox-amt]');
      if (f && !(ox.mode === 'pagos' && ox.kind === 'fx')) { f.value = ox.amt ? fmt(ox.amt) : ''; return; }
      const s = e.target.closest('[data-ox-acct]');
      if (s) {
        const role = s.dataset.oxAcct; ox[role] = s.value;
        if (ox.kind === 'fx') {
          if (role === 'buy' && ox.buy && (!ox.pay || ox.pay === ox.buy)) ox.pay = bestSource(ox.buy, calc().buyAmt);
          if (role === 'pay' && ox.pay === ox.buy) ox.buy = '';
        }
        renderOp(); return;
      }
      const dsel = e.target.closest('[data-ox-dest]');
      if (dsel) {
        ox.dest = dsel.value; const d = payDest();
        if (d) { ox.buy = d.cur; if (!ox.pay || (d.own && ox.pay === d.cur)) ox.pay = d.own ? bestSource(d.cur, ox.amt || 1) : (acct(d.cur) ? d.cur : ''); }
        else ox.buy = '';
        renderOp(); return;
      }
      const pid = e.target.closest('[data-ox-payid]');
      if (pid) {
        ox.pend = { t: 'p', id: Number(pid.dataset.oxPayid) };
        const n = opx.querySelector('#ox-dnext'); if (n) n.disabled = false; return;
      }
      const k = e.target.closest('[data-ox-sel]');
      if (k) {
        const id = Number(k.dataset.oxSel);
        if (k.checked) ox.sel.add(id); else ox.sel.delete(id);
        ox.buy = ox.sel.size ? selPays()[0].cur : '';
        ox.total = false;
        if (ox.buy && (!ox.pay || ox.pay === ox.buy)) ox.pay = bestSource(ox.buy, calc().buyAmt);
        renderOp();
      }
    });
    opx.addEventListener('toggle', e => { if (e.target.matches && e.target.matches('.ox-more')) ox.reasonOpen = e.target.open; }, true);
    // Esc cierra la ventana emergente (cancela). Tab se queda dentro de ella
    document.addEventListener('keydown', e => {
      if (!ox.open || !ox.modal) return;
      if (e.key === 'Escape') { e.preventDefault(); backToBuild('Operación cancelada. No se envió nada.'); return; }
      if (e.key === 'Tab') {
        const els = [...opx.querySelectorAll('.ox-modal button:not([disabled]), .ox-modal [href]')];
        if (!els.length) return;
        const first = els[0], last = els[els.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        else if (!opx.querySelector('.ox-modal').contains(document.activeElement)) { e.preventDefault(); first.focus(); }
      }
    });

    /* Historial en Últimas operaciones: la acción Cancelar vive en la fila */
    function cancelFromTable(id) {
      const rec = OPS.find(r => r.id === id);
      if (rec) cancelRec(rec);
    }
    // Si cambia la hora del mercado con el flujo abierto, se vuelve a evaluar
    function refreshFlow() {
      if (!ox.open) return;
      if (ox.step === 1) renderOp();
      else if ((ox.step === 2 || ox.step === 3) && !ox.modal) { const m = blockMsg(); if (m) backToBuild(`${m} Descartamos la cotización. No se envió nada.`); }
    }

    /* Selects del flujo con el mismo menú flotante que la home (Filtros, Elegir pares): panel blanco, borde divider, radio 8, sombra.
       El select nativo queda oculto como fuente de verdad: elegir una opción le asigna el valor y dispara "change", así la lógica existente no cambia. */
    let ddOpen = null;
    function ddClose(focusBtn) { if (!ddOpen) return; const { btn, menu } = ddOpen; menu.hidden = true; btn.setAttribute('aria-expanded', 'false'); ddOpen = null; if (focusBtn) btn.focus(); }
    function ddOpenMenu(btn, menu) {
      if (ddOpen && ddOpen.menu !== menu) ddClose(false);
      menu.hidden = false; btn.setAttribute('aria-expanded', 'true'); ddOpen = { btn, menu };
      const cur = menu.querySelector('[aria-selected="true"]') || menu.querySelector('[role="option"]'); if (cur) cur.focus();
    }
    function enhanceSelects() {
      opx.querySelectorAll('select.ox-in:not([data-dd])').forEach(sel => {
        sel.setAttribute('data-dd', ''); sel.classList.add('ox-dd-native'); sel.tabIndex = -1; sel.setAttribute('aria-hidden', 'true');
        const wrap = document.createElement('div'); wrap.className = 'ox-dd';
        const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'ox-in ox-dd-btn';
        btn.setAttribute('aria-haspopup', 'listbox'); btn.setAttribute('aria-expanded', 'false');
        const lab = sel.id && opx.querySelector(`label[for="${sel.id}"]`);
        btn.setAttribute('aria-label', (lab ? lab.textContent.trim() : sel.getAttribute('aria-label') || 'Elegir') );
        if (sel.dataset.fk) { btn.dataset.fk = sel.dataset.fk; sel.removeAttribute('data-fk'); }
        if (sel.disabled) { btn.disabled = true; if (sel.title) btn.title = sel.title; }
        const opt = sel.options[sel.selectedIndex];
        btn.innerHTML = `<span class="ox-dd-v ${opt && opt.value ? '' : 'ph'}">${escHtml(opt ? opt.text : '')}</span>`;
        const menu = document.createElement('div'); menu.className = 'ox-dd-menu'; menu.setAttribute('role', 'listbox'); menu.hidden = true;
        let html = '';
        [...sel.children].forEach(ch => {
          const isAcct = sel.matches('[data-ox-acct]');
          const one = o => o.value === '' ? '' : `<div class="ox-dd-opt" role="option" tabindex="-1" data-v="${escHtml(o.value)}" aria-selected="${o.selected}"><span class="ox-dd-ol">${isAcct ? flagOf(o.value) : ''}<span>${escHtml(o.text)}</span></span>${o.selected ? '<i class="ti ti-check" aria-hidden="true"></i>' : ''}</div>`;
          if (ch.tagName === 'OPTGROUP') html += `<div class="ox-dd-grp" role="presentation">${escHtml(ch.label)}</div>` + [...ch.children].map(one).join('');
          else html += one(ch);
        });
        menu.innerHTML = html;
        sel.after(wrap); wrap.append(btn, menu);
        const pick = el => {
          ddClose(true); if (sel.value === el.dataset.v) return;
          sel.value = el.dataset.v;
          const v = btn.querySelector('.ox-dd-v'); v.textContent = el.textContent; v.classList.remove('ph');
          menu.querySelectorAll('[role="option"]').forEach(o => { const on = o === el; o.setAttribute('aria-selected', on); const ic = o.querySelector('.ti'); if (ic) ic.remove(); if (on) o.insertAdjacentHTML('beforeend', '<i class="ti ti-check" aria-hidden="true"></i>'); });
          sel.dispatchEvent(new Event('change', { bubbles: true }));
        };
        btn.addEventListener('click', () => { menu.hidden ? ddOpenMenu(btn, menu) : ddClose(false); });
        btn.addEventListener('keydown', e => { if (['ArrowDown', 'ArrowUp'].includes(e.key)) { e.preventDefault(); ddOpenMenu(btn, menu); } });
        menu.addEventListener('click', e => { const o = e.target.closest('[role="option"]'); if (o) pick(o); });
        menu.addEventListener('keydown', e => {
          const opts = [...menu.querySelectorAll('[role="option"]')], i = opts.indexOf(document.activeElement);
          if (e.key === 'ArrowDown') { e.preventDefault(); (opts[i + 1] || opts[0]).focus(); }
          else if (e.key === 'ArrowUp') { e.preventDefault(); (opts[i - 1] || opts[opts.length - 1]).focus(); }
          else if (e.key === 'Home') { e.preventDefault(); opts[0].focus(); }
          else if (e.key === 'End') { e.preventDefault(); opts[opts.length - 1].focus(); }
          else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (opts[i]) pick(opts[i]); }
          else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); ddClose(true); }
          else if (e.key === 'Tab') ddClose(false);
        });
      });
      if (document.activeElement && document.activeElement.matches && document.activeElement.matches('select[data-dd]')) { const b = document.activeElement.nextElementSibling && document.activeElement.nextElementSibling.querySelector('.ox-dd-btn'); if (b) b.focus(); }
    }
    document.addEventListener('mousedown', e => { if (ddOpen && !e.target.closest('.ox-dd')) ddClose(false); });
    renderOp = (orig => function () { ddOpen = null; const out = orig.apply(this, arguments); enhanceSelects(); return out; })(renderOp);
    window.openOp = openOp; window.oxCancel = cancelFromTable; window.oxRefresh = refreshFlow; window.oxOpen = () => ox.open; window.oxClose = closeOp;
  })();

  setInterval(() => {
    if (!mktState().live) { renderPairs(); return; }
    if (window.oxOpen && oxOpen()) return;
    for (const [name, p] of Object.entries(PAIRS)) {
      const step = p.buy > 50 ? 0.05 : p.buy < 2 ? 0.0004 : 0.02;
      if (p.base0 == null) { p.base0 = p.buy; p.spread = Number((p.buy - p.sell).toFixed(p.dp)); }
      let d = Math.round((Math.random() - 0.5) * 2) * step;
      if (Math.abs(p.buy + d - p.base0) > step * 3) d = p.buy > p.base0 ? -step : step;
      state.ticks[name] = { d };
      if (!d) continue;
      p.buy = Number((p.buy + d).toFixed(p.dp));
      p.sell = Number((p.buy - p.spread).toFixed(p.dp));
    }
    renderPairs();
    renderSummary();
    if (!state.editing) renderTable('cuentas');
    renderInsights();
  }, 3000);

  state.cards.insights = { collapsed: false, wide: true };
  renderNotifs();
  mountCardControls();
  renderSummary();
  renderInsights();
  mountTable('cuentas');
  mountTable('pagos');
  mountTable('ingresos');
  renderPairs();
  // Carga inicial simulada: skeleton en todas las cards ~700 ms
  setTimeout(() => { UI.boot = false; renderAll(); }, 700);
</script>

  const set=o=>{sb.classList.toggle('is-open',o);lg.setAttribute('aria-expanded',String(o));lg.setAttribute('aria-label',o?'Colapsar menú':'Expandir menú');};

<script>
// Tooltip único para íconos con acción (usa data-tip, title o aria-label)
(function(){
  const SEL = '.kpi-go, .eye, .tool, .rcpt-x, .close, .btn-icon, .rcpt-btn, .reco-cfg-btn, .insight-x, [data-tip]';
  const tip = document.createElement('div'); tip.className = 'ui-tip'; tip.setAttribute('role', 'tooltip'); tip.hidden = true; document.body.appendChild(tip);
  const show = el => {
    if (el.title) { el.dataset.tip = el.dataset.tip || el.title; el.removeAttribute('title'); }
    const t = el.dataset.tip || el.getAttribute('aria-label'); if (!t) return;
    tip.textContent = t; tip.style.whiteSpace = el.hasAttribute('data-tip-wrap') ? 'normal' : ''; tip.style.maxWidth = el.hasAttribute('data-tip-wrap') ? '240px' : ''; tip.style.width = el.hasAttribute('data-tip-wrap') ? 'max-content' : ''; tip.style.left = '0px'; tip.hidden = false;
    const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    let top = r.top - h - 6; if (top < 8) top = r.bottom + 6;
    tip.style.top = top + 'px'; tip.style.left = Math.max(8, Math.min(r.left + r.width / 2 - w / 2, innerWidth - w - 8)) + 'px';
  };
  const hide = () => { tip.hidden = true; };
  document.addEventListener('mouseover', e => { const el = e.target.closest(SEL); if (el && !el.closest('.btn:not(.btn-icon)')) show(el); else hide(); });
  document.addEventListener('focusin', e => { const el = e.target.closest(SEL); if (el && e.target.matches(':focus-visible')) show(el); });
  document.addEventListener('focusout', hide); document.addEventListener('scroll', hide, true); document.addEventListener('mousedown', hide);
})();
</script>

<script>
  /* Detalle de cuenta: editar el nombre en el lugar, y la miga "Inicio" vuelve al inicio desde un flujo abierto en una cuenta */
  (function () {
    function startEdit(cur) {
      const box = document.querySelector(`[data-acct-name="${cur}"]`); if (!box) return;
      const now = acct(cur).alias;
      box.innerHTML = `<form class="acct-name-form" data-acct-name-form="${cur}"><input name="alias" maxlength="30" value="${now.replace(/"/g, '&quot;')}" aria-label="Nombre de la cuenta ${cur}">
        <button class="btn btn-primary" type="submit">Guardar</button><button class="btn" type="button" data-acct-name-cancel="${cur}">Cancelar</button></form><div class="acct-name-err" role="alert"></div>`;
      const i = box.querySelector('input'); i.focus(); i.select();
      i.addEventListener('input', () => { i.classList.remove('is-invalid'); box.querySelector('.acct-name-err').textContent = ''; });
      i.addEventListener('keydown', e => { if (e.key === 'Escape') { e.stopPropagation(); openAccount(cur, true); } });
    }
    document.addEventListener('click', e => {
      const ed = e.target.closest('[data-acct-alias-edit]'); if (ed) { e.preventDefault(); startEdit(ed.dataset.acctAliasEdit); return; }
      const cn = e.target.closest('[data-acct-name-cancel]'); if (cn) { openAccount(cn.dataset.acctNameCancel, true); return; }
      const home = e.target.closest('[data-crumb-home]'); if (home) { if (window.oxOpen && oxOpen()) oxClose(); const back = document.querySelector('[data-acct-back]'); if (back) back.click(); }
    }, true);
    document.addEventListener('submit', e => {
      const f = e.target.closest('[data-acct-name-form]'); if (!f) return;
      e.preventDefault(); e.stopPropagation();
      const cur = f.dataset.acctNameForm, v = f.alias.value.trim();
      if (!v) { f.alias.classList.add('is-invalid'); f.parentElement.querySelector('.acct-name-err').textContent = 'Escribe un nombre para la cuenta.'; f.alias.focus(); return; }
      acct(cur).alias = v;
      openAccount(cur, true);
      if (typeof renderAll === 'function') renderAll(true);
      toast('Nombre de la cuenta actualizado');
    }, true);
  })();
</script>
